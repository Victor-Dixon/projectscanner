[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "projectscanner"
version = "0.1.0"
description = "Repo intelligence scanner for Dream.OS portfolios"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
gui = ["PyQt5>=5.15.0"]
dev = ["pytest>=8.0"]
hygiene = [
    "we-are-swarm-agenttools @ git+https://github.com/Victor-Dixon/AgentTools.git@959681dbeca5191d2e0e333feeb5b6229437c0a0",
]

[project.scripts]
projectscanner = "projectscanner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
