name: Scanner Snapshot

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install scanner and test dependencies
        run: pip install -e '.[dev,hygiene]'

      - name: Run focused productization, planning, RAG, and hygiene regression tests
        shell: bash
        run: |
          set +e
          pytest -q \
            tests/test_cli.py \
            tests/test_fleet_hygiene_snapshot.py \
            tests/test_snapshot_contract.py \
            tests/test_phase2_handoff.py \
            tests/test_export_project_intelligence.py \
            tests/test_export_rag_corpus.py \
            tests/test_planning_contract.py \
            tests/test_scanner_snapshot_workflow.py \
            --tb=short --junitxml=pytest-results.xml 2>&1 | tee pytest-output.txt
          status=${PIPESTATUS[0]}
          tail -n 160 pytest-output.txt > pytest-tail.txt
          exit "$status"

      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: projectscanner-pytest-${{ github.run_id }}
          path: |
            pytest-results.xml
            pytest-output.txt
            pytest-tail.txt
          if-no-files-found: warn

      - name: Run scanner
        id: scan
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            MODE="pr"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            MODE="release"
          elif [[ "${{ github.ref_name }}" == "master" ]]; then
            MODE="master"
          else
            MODE="manual"
          fi

          TIMESTAMP=$(date -u +"%Y-%m-%dT%H-%M-%SZ")
          SNAPSHOT_DIR="snapshots/${GITHUB_REF_NAME}-${TIMESTAMP}-${GITHUB_SHA::8}"
          mkdir -p "$SNAPSHOT_DIR"

          START=$(date +%s)
          projectscanner scan ./src --output "$SNAPSHOT_DIR"
          END=$(date +%s)
          DURATION=$((END - START))

          PR_NUMBER=""
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
          fi

          cat > "$SNAPSHOT_DIR/metadata.json" << EOF
          {
            "commit_sha": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "timestamp": "$TIMESTAMP",
            "scanner_version": "$(python -c 'import importlib.metadata as m; print(m.version("projectscanner"))' 2>/dev/null || echo unknown)",
            "python_version": "$(python --version 2>&1)",
            "workflow_run_id": "${{ github.run_id }}",
            "workflow_run_number": "${{ github.run_number }}",
            "duration_seconds": $DURATION,
            "scan_mode": "$MODE",
            "event_name": "${{ github.event_name }}",
            "pr_number": "$PR_NUMBER"
          }
          EOF

          echo "snapshot_dir=$SNAPSHOT_DIR" >> "$GITHUB_OUTPUT"
          echo "SNAPSHOT_DIR=$SNAPSHOT_DIR" >> "$GITHUB_ENV"

      - name: Upload snapshot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scanner-snapshot-${{ github.run_id }}
          path: snapshots/
          retention-days: 90
          if-no-files-found: error

      - name: (PR only) Comment summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const metadata = JSON.parse(fs.readFileSync(`${process.env.SNAPSHOT_DIR}/metadata.json`, 'utf8'));
            const comment = `## Scanner Snapshot\n` +
              `- Mode: ${metadata.scan_mode}\n` +
              `- Duration: ${metadata.duration_seconds}s\n` +
              `- [Download artifact](${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${metadata.workflow_run_id})`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
