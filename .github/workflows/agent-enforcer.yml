name: Agent Enforcer

on: [push, pull_request]

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        run: |
          pip install ruff radon wily
          pip install pre-commit
          
      - name: Run Ruff on changed Python files
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          echo "🔍 Running Ruff on changed Python files..."
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
          else
            base_sha="$PUSH_BASE_SHA"
          fi

          if [ -z "$base_sha" ] || [[ "$base_sha" =~ ^0+$ ]]; then
            mapfile -t python_files < <(git ls-files '*.py')
          else
            mapfile -t python_files < <(
              git diff --name-only --diff-filter=ACMR "$base_sha" "$GITHUB_SHA" -- '*.py'
            )
          fi

          if [ "${#python_files[@]}" -eq 0 ]; then
            echo "✅ No changed Python files to lint"
            exit 0
          fi

          printf 'Linting %s\n' "${python_files[@]}"
          ruff check --output-format=github -- "${python_files[@]}"
          
      - name: Check cyclomatic complexity
        run: |
          echo "🧮 Checking cyclomatic complexity..."
          radon cc -s -a . || echo "⚠️ High complexity detected"
          
      - name: Check LOC per file
        run: |
          echo "📊 Checking Lines of Code..."
          radon raw . || echo "⚠️ Large files detected"
          
      - name: Verify AGENTS.md exists
        run: |
          echo "📋 Checking for AGENTS.md..."
          if [ ! -f "AGENTS.md" ]; then
            echo "❌ AGENTS.md not found - this is required for agent repositories"
            exit 1
          else
            echo "✅ AGENTS.md found"
          fi
          
      - name: Check for required files
        run: |
          echo "🔍 Checking for required policy files..."
          missing_files=()

          if [ ! -f "AGENTS.md" ]; then
            missing_files+=("AGENTS.md")
          fi

          if [ ! -f ".pre-commit-config.yaml" ] && [ ! -f "config/.pre-commit-config.yaml" ]; then
            missing_files+=(".pre-commit-config.yaml or config/.pre-commit-config.yaml")
          fi
          
          if [ ${#missing_files[@]} -ne 0 ]; then
            echo "❌ Missing required files: ${missing_files[*]}"
            echo "Please ensure all agent policy files are present"
            exit 1
          else
            echo "✅ All required policy files present"
          fi
          
      - name: Run custom complexity checks
        run: |
          echo "🔧 Running custom complexity checks..."
          if [ -f "scripts/complexity_checker.py" ]; then
            python scripts/complexity_checker.py --max-complexity=10 --class-max-complexity=15
          else
            echo "⚠️ Custom complexity checker not found, using radon only"
          fi
          
      - name: Run LOC checks
        run: |
          echo "📏 Running LOC checks..."
          if [ -f "scripts/loc_checker.py" ]; then
            python scripts/loc_checker.py --max-loc=350 --gui-max-loc=500
          else
            echo "⚠️ Custom LOC checker not found, using radon only"
          fi
          
      - name: Run OOP structure checks
        run: |
          echo "🏗️ Running OOP structure checks..."
          if [ -f "scripts/oop_checker.py" ]; then
            python scripts/oop_checker.py
          else
            echo "⚠️ Custom OOP checker not found"
          fi
          
      - name: Summary
        run: |
          echo "🎯 Agent Policy Enforcement Complete"
          echo "✅ All checks passed - code meets agent standards"
          echo "📋 Standards enforced:"
          echo "   - Linting (Ruff)"
          echo "   - Cyclomatic Complexity (≤10 functions, ≤15 classes)"
          echo "   - Lines of Code (≤350 core, ≤500 GUI)"
          echo "   - OOP Structure (class-based, SRP)"
          echo "   - Required Files (AGENTS.md, .pre-commit-config.yaml)" 